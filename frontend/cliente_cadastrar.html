<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <script src="./app.js" defer></script>
    <script src="./cliente_cadastrar.js" defer></script>
    <title>Cliente - PixelFix</title>
</head>
<body>
    <main id="conteudo">
        <h1 id="titulo">Cadastrar Cliente</h1><br>
        <form id="form_cliente" novalidate>
            <label for="nome">Nome</label><br>
            <input type="text" id="nome" maxlength="100" required><br><br>

            <label for="email">E-mail</label><br>
            <input type="email" id="email" maxlength="100" required><br><br>

            <label for="senha" id="label_senha">Senha (mín. 6 caracteres)</label><br>
            <input type="password" id="senha" autocomplete="new-password"><br><br>

            <label for="cpf">CPF</label><br>
            <input type="text" id="cpf" inputmode="numeric" placeholder="000.000.000-00" required><br><br>

            <label for="telefone">Telefone celular</label><br>
            <input type="tel" id="telefone" inputmode="numeric" placeholder="(47) 99999-9999" required><br><br>

            <button type="submit" id="btn_salvar">Cadastrar</button>
        </form>
        <div id="resposta" class="resposta" role="status" aria-live="polite"></div>
        <p class="link-extra" id="link_login" hidden><a class="destaque" href="./login.html">Ir para o login</a></p>
    </main>
</body>
</html>
